name: Windows build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the build to (must already exist). Leave empty to only build."
        required: false
        default: ""
      release_notes:
        description: "Release notes (first line is shown in Mike's update banner)."
        required: false
        default: "Mike now has a real Setup.exe installer, and knows who built him."

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build via packaging/build_windows.py
        # Not a bare `pyinstaller ... main.py` one-liner: that form has no
        # hiddenimports for the platform-dispatched modules (computer.windows,
        # voice.recognizer.windows, voice.providers.windows) and, critically,
        # never pre-generates comtypes' UI Automation bindings -- comtypes
        # disables its own runtime codegen once frozen, so a build from that
        # one-liner launches but computer.windows silently can't see or
        # click anything. Verified on a real machine, not assumed.
        # build_windows.py runs the real packaging/mike.spec and produces
        # dist/Mike-windows-<version>.zip, version read from
        # config.settings.VERSION so the filename can't drift from the
        # release tag by hand.
        run: python packaging/build_windows.py

      - name: Build the Setup.exe installer (Inno Setup)
        # The zip stays: installed copies update from it. First-time users get
        # the Setup.exe, a normal wizard, instead of unzipping by hand.
        shell: pwsh
        run: |
          choco install innosetup --no-progress -y
          $v = python -c "from config.settings import VERSION; print(VERSION)"
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$v" packaging\mike.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path "dist\Mike-Setup-$v.exe")) { throw "Setup.exe was not produced" }

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mike-windows
          path: |
            dist/Mike-windows-*.zip
            dist/Mike-Setup-*.exe
          retention-days: 30

      - name: Attach to release
        if: ${{ inputs.release_tag != '' }}
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          name: Mike ${{ inputs.release_tag }}
          body: ${{ inputs.release_notes }}
          files: |
            dist/Mike-windows-*.zip
            dist/Mike-Setup-*.exe
