name: Windows build

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to attach the build to (must already exist)"
        required: true
        default: "v1.0.0"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build via packaging/build_windows.py
        # Not a bare `pyinstaller ... main.py` one-liner: that form has no
        # hiddenimports for the platform-dispatched modules (computer.windows,
        # voice.recognizer.windows, voice.providers.windows) and, critically,
        # never pre-generates comtypes' UI Automation bindings -- comtypes
        # disables its own runtime codegen once frozen, so a build from that
        # one-liner launches but computer.windows silently can't see or
        # click anything. Verified on a real machine, not assumed.
        # build_windows.py runs the real packaging/mike.spec and produces
        # dist/Mike-windows-<version>.zip, version read from
        # config.settings.VERSION so the filename can't drift from the
        # release tag by hand.
        run: python packaging/build_windows.py

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mike-windows-1.0.0
          path: dist/Mike-windows-*.zip
          retention-days: 30

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag }}
          files: dist/Mike-windows-*.zip
