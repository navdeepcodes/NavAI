<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#F6F3EE;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#F6F3EE;padding:40px 16px;">
      <tr><td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:460px;background:#FBFAF7;border:1px solid #E6E1D8;border-radius:16px;">
          <tr><td style="padding:36px 36px 8px 36px;font-family:Georgia,'Source Serif 4',serif;color:#1A1714;">
            <div style="font-size:20px;font-weight:600;margin:0 0 20px 0;">Mike</div>
            <div style="font-size:22px;font-weight:600;line-height:1.3;margin:0 0 12px 0;">Your sign-in code</div>
            <div style="font-size:15px;line-height:1.6;color:#4A443C;margin:0 0 24px 0;">Enter this code in Mike to sign in.</div>
          </td></tr>
          <tr><td align="center" style="padding:0 36px;">
            <div style="font-family:'SFMono-Regular',Consolas,'Liberation Mono',monospace;font-size:32px;letter-spacing:10px;font-weight:600;color:#1A1714;background:#F1ECE4;border-radius:12px;padding:18px 0;">{{ .Token }}</div>
          </td></tr>
          <tr><td style="padding:24px 36px 36px 36px;font-family:Georgia,'Source Serif 4',serif;font-size:13px;line-height:1.6;color:#7A7268;">
            The code works for one hour and only once. If you didn't ask for this, you can ignore this email — nothing will change.
          </td></tr>
        </table>
      </td></tr>
    </table>
  </body>
</html>
